# Monthly dependency updates, one grouped pull request per ecosystem, so CI checks them together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # The engine and the rules library are pinned on purpose: a new version changes what reviews and lessons say,
    # so they are upgraded by hand with a look at the results.
    ignore:
      - dependency-name: stockfish
      - dependency-name: chess.js
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
