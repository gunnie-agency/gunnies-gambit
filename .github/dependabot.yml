# Monthly dependency updates, one grouped pull request per ecosystem, so CI checks them together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # The engine and the rules library are pinned on purpose: a new version changes what reviews and lessons say,
    # so they are upgraded by hand with a look at the results.
    ignore:
      - dependency-name: stockfish
      - dependency-name: chess.js
      # Follows the Node version in .nvmrc and package.json engines, not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Minor and patch updates come together; a major version gets a pull request of its own.
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
